[project]
name = "cctv"
version = "0.1.0"
description = "Bangkok CCTV image analysis pipeline (2110403 DSDE project)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pandas",
    "pillow",
    "plotly>=7.1.0",
    "pyarrow",
    "streamlit>=1.67.0",
    "ultralytics",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cctv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
