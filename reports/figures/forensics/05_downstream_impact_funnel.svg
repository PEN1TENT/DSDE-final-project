  <text x="664" y="212.0" font-size="10.8" font-weight="600">400×266 white PNGs</text>
  <text x="664" y="227.0" font-size="9.3" fill="#52514e">Decoded by cv2 as brightness=255, sharpness=0</text>
  <text x="870" y="215.0" font-size="11.5" font-weight="700" fill="#d63638">0</text>
  <rect x="985" y="203.0" width="150.4" height="16" fill="#f59e0b" rx="2" />
  <text x="1141.379746835443" y="215.0" font-size="11" font-weight="700" fill="#0b0b0b">504</text>
  <text x="664" y="258.0" font-size="10.8" font-weight="600">246×205 GStreamer bars</text>
  <text x="664" y="273.0" font-size="9.3" fill="#52514e">Decoded as valid JPEGs; 0 vehicles detected</text>
  <text x="870" y="261.0" font-size="11.5" font-weight="700" fill="#d63638">0</text>
  <rect x="985" y="249.0" width="9.8" height="16" fill="#7b4dbb" rx="2" />
  <text x="1000.8462929475588" y="261.0" font-size="11" font-weight="700" fill="#0b0b0b">33</text>
  <text x="664" y="304.0" font-size="10.8" font-weight="600">Truncated JPEGs (595)</text>
  <text x="664" y="319.0" font-size="9.3" fill="#52514e">Missing 0xFFD9 EOI; identical 21,900B buffer</text>
  <text x="870" y="307.0" font-size="11.5" font-weight="700" fill="#52514e">2</text>
  <rect x="985" y="295.0" width="6.0" height="16" fill="#be185d" rx="2" />
  <text x="997.0" y="307.0" font-size="11" font-weight="700" fill="#0b0b0b">2</text>
  <text x="650" y="368" font-size="12.5" font-weight="700">`rain.py` Pre-Baseline Cell Completeness (10,500 Active 06–20h Cells)</text>
  <rect x="650" y="382" width="550" height="211" fill="#ffffff" stroke="#e4e3df" stroke-width="1" />
  <rect x="670.0" y="416" width="491.8" height="34" fill="#1baf7a" />
  <rect x="1161.8" y="416" width="14.6" height="34" fill="#d63638" />
  <rect x="1176.4" y="416" width="3.6" height="34" fill="#eb6834" />
  <text x="670" y="406" font-size="11" font-weight="700" fill="#0b0b0b">10,500 (camera, date, hour) cells in 06–20h: 10,125 kept · 375 dropped</text>
  <rect x="670" y="469" width="11" height="11" fill="#1baf7a" rx="2" />
  <text x="688" y="478" font-size="10.5" fill="#52514e">10,125 complete cells (&gt;=3 live JPEGs) -&gt; 59,774 clean snapshots</text>
  <rect x="670" y="495" width="11" height="11" fill="#d63638" rx="2" />
  <text x="688" y="504" font-size="10.5" fill="#52514e">300 Thu 27 AM cells (06–08h) dropped before weekday baseline (avoids 3-cam bias)</text>
  <rect x="670" y="521" width="11" height="11" fill="#eb6834" rx="2" />
  <text x="688" y="530" font-size="10.5" fill="#52514e">75 freeze/gap cells dropped (cams 150, 206, 395, 938, 939, 1195)</text>
  <rect x="670" y="547" width="11" height="11" fill="#a3a29d" rx="2" />
  <text x="688" y="556" font-size="10.5" fill="#52514e">+ 354 trailing 21:00–21:01 single-sweep boundary cells excluded</text>
  <line x1="36" y1="648" x2="1204" y2="648" stroke="#e4e3df" stroke-width="1" />
  <text x="36" y="667" font-size="10.5" fill="#7a7872">Source: reports/forensics/corpus_summary.json, hourly_coverage.csv; remediated in src/cctv/inventory.py &amp; src/cctv/rain.py.</text>
